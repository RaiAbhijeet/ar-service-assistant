# Demo object: Siemens dishwasher.
# Adding an object = adding a folder like this one. No code changes anywhere.
#
# BEFORE USING THIS FILE:
#   1. Find the E-Nr. on the sticker along the door edge (e.g. SN45ZS49CE/01).
#   2. Download the matching Gebrauchsanleitung PDF from Siemens' public support site.
#   3. Run `sha256sum <file>` and paste URL + hash below.
#   4. Replace every <PLACEHOLDER>. Fault codes MUST come from your manual — do not guess.

id: siemens-dishwasher
name_de: Siemens Geschirrspüler
name_en: Siemens dishwasher
model_enr: "SX63HX52BE/24"

# ------------------------------------------------------------------ manual source
# The PDF is NOT stored in this repository. `make ingest` downloads it and verifies
# the hash before use. See README section on licensing.
manuals:
  - id: gebrauchsanleitung
    title_de: "Siemens Geschirrspüler — Gebrauchs- und Aufstellanleitung"
    url: "https://media3.bsh-group.com/Documents/9001637670_B.pdf"
    sha256: "c4f0ec621ad42cd62f8d8ce993b6779a2d966d79e7860d7250ee822aa6dafa15"
    language: de
    # Which sections carry procedural content worth indexing. Confirm against your PDF.
    relevant_sections_de:
      - "Reinigen und Warten"
      - "Sieb / Siebkombination reinigen"
      - "Sprüharme reinigen"
      - "Wasserenthärtungsanlage / Salz einfüllen"
      - "Klarspüler einfüllen"
      - "Reiniger dosieren"
      - "Geschirr einordnen / Körbe verstellen"
      - "Störungen, was tun?"
    license_note: >
      Copyright BSH Hausgeräte GmbH / Siemens. Not redistributed in this repository.
      Downloaded at ingest time from the manufacturer's public support site.

# --------------------------------------------------------------------- part list
