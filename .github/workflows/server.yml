name: server
on:
  push: { paths: ['server/**', '.github/workflows/server.yml'] }
  pull_request: { paths: ['server/**'] }

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arsa
          POSTGRES_PASSWORD: arsa
          POSTGRES_DB: arsa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -e "server[dev]"
      - run: ruff check server
      - run: ruff format --check server
      # --config-file is required here: mypy only auto-discovers a config
      # file in its cwd (the repo root in CI), and server/pyproject.toml
      # (which ignores asyncpg's missing stubs) lives one level down.
      - run: mypy --strict --config-file server/pyproject.toml server/app server/ingest
      - run: pytest server/tests -q --cov=server/app --cov-report=term-missing --cov-fail-under=80
        env:
          # Must match app.config.Settings' field names, not an arbitrary
          # DATABASE_URL (which nothing in the app reads). Unit tests mock
          # asyncpg entirely today, so this only matters once a real
          # integration test needs the live `postgres` service above.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: arsa
          POSTGRES_PASSWORD: arsa
          POSTGRES_DB: arsa_test
