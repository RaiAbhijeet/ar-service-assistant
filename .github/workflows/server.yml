name: server
on:
  push: { paths: ['server/**', '.github/workflows/server.yml'] }
  pull_request: { paths: ['server/**'] }

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arsa
          POSTGRES_PASSWORD: arsa
          POSTGRES_DB: arsa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -e "server[dev]"
      - run: ruff check server
      - run: ruff format --check server
      - run: mypy --strict server/app
      - run: pytest server/tests -q --cov=server/app --cov-report=term-missing --cov-fail-under=80
        env:
          DATABASE_URL: postgresql://arsa:arsa@localhost:5432/arsa_test
