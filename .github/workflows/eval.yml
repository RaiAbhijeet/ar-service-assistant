name: eval
on:
  schedule: [{ cron: '0 3 * * *' }]
  pull_request: { paths: ['server/app/retrieval/**', 'server/ingest/**', 'server/eval/**'] }
  workflow_dispatch:

# Runs on the self-hosted runner because it needs the GPU and the ingested corpus.
jobs:
  golden-set:
    runs-on: [self-hosted, gpu]
    # TODO(M0.4 · ingest & eval pipeline): server/eval/run_eval.py,
    # server/eval/check_thresholds.py and server/eval/thresholds.yaml don't
    # exist yet, so this job cannot pass. continue-on-error keeps the failure
    # from blocking the workflow conclusion without hiding it — the job
    # still runs and still reports failed (⚠) in the Actions UI. Remove
    # continue-on-error once that milestone lands; do not delete the job or
    # weaken server/eval/thresholds.yaml to make it pass early.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: make eval
      - run: python server/eval/check_thresholds.py docs/benchmarks/eval-latest.json server/eval/thresholds.yaml
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: eval-report, path: docs/benchmarks/eval-latest.json }
