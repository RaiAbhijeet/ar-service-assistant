[project]
name = "arsa"
version = "0.1.0"
description = "AR Service Assistant — offline edge server (FSM orchestrator, vision, retrieval, STT/TTS)."
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
    "structlog>=24.4,<25",
    "asyncpg>=0.30,<1",
    "pgvector>=0.3,<1",
    "numpy>=2.1,<3",
    "pyyaml>=6.0,<7",
    "pymupdf>=1.28,<2",
    "prometheus-client>=0.21,<1",
    "opentelemetry-sdk>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "eval"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "ingest", "eval"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "ingest", "eval"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "ingest", "eval"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# asyncpg ships no inline type information / stub package. (pgvector is a
# declared dependency for the retrieval module, not yet imported anywhere —
# add it here if/when it needs the same treatment.)
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF ships a py.typed marker but its stubs are incomplete for the APIs
# ingest/chunk.py uses (e.g. Document.__iter__ isn't declared even though
# iterating a Document works fine at runtime). follow_imports = "skip"
# treats it as effectively untyped instead of surfacing stub-incompleteness
# errors that have nothing to do with this codebase's own correctness.
module = ["pymupdf"]
follow_imports = "skip"

# -------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
